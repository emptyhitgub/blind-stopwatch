<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blind Stopwatch</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
<style>
  :root{
    --ink:#1c1810;
    --ink-soft:#4a3f2c;
    --paper:#e6d9b8;
    --paper-raised:#efe2c0;
    --paper-deep:#d8c592;
    --brass-1:#c9a15a;
    --brass-2:#8a6224;
    --brass-3:#5e4318;
    --aetherite-bright:#2f8378;
    --rust:#7a3320;
    --line:rgba(28,24,16,.28);
    --shadow:rgba(28,24,16,.35);
    --focus:#2f8378;
    --lcd-bg:#100d09;
    --lcd-fg:#6fe0c9;
    --lcd-fg-masked:#e2664a;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#e9ddb8; --ink-soft:#bfae82; --paper:#121116; --paper-raised:#1b1a20;
      --paper-deep:#232028; --brass-1:#d9ad63; --brass-2:#a97b2f; --brass-3:#6b4d1e;
      --aetherite-bright:#6bc4b8; --rust:#c9694f;
      --line:rgba(233,221,184,.16); --shadow:rgba(0,0,0,.6); --focus:#6bc4b8;
    }
  }
  :root[data-theme="dark"]{
    --ink:#e9ddb8; --ink-soft:#bfae82; --paper:#121116; --paper-raised:#1b1a20;
    --paper-deep:#232028; --brass-1:#d9ad63; --brass-2:#a97b2f; --brass-3:#6b4d1e;
    --aetherite-bright:#6bc4b8; --rust:#c9694f;
    --line:rgba(233,221,184,.16); --shadow:rgba(0,0,0,.6); --focus:#6bc4b8;
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0; background:
      radial-gradient(ellipse at 50% 38%, var(--paper-raised) 0%, var(--paper) 72%);
    color:var(--ink); font-family:'IBM Plex Mono',monospace;
    display:flex; align-items:center; justify-content:center; padding:40px 16px;
  }

  .stage{ font-size:clamp(13.5px,4.6vw,20px); display:flex; flex-direction:column; align-items:center; gap:1.4em; }

  /* ============ the watch ============ */
  .watch{ position:relative; width:16em; height:16em; }

  .case{
    position:absolute; inset:0; border-radius:50%;
    background:
      radial-gradient(circle at 32% 28%, var(--brass-1), var(--brass-2) 55%, var(--brass-3) 100%);
    box-shadow:
      0 1.2em 2.2em var(--shadow),
      inset 0 0 0 .18em rgba(0,0,0,.25),
      inset 0 .12em .3em rgba(255,255,255,.35);
  }
  .case::before, .case::after{
    content:""; position:absolute; inset:0; border-radius:50%;
  }
  /* minute ticks */
  .case::before{
    z-index:1;
    background: repeating-conic-gradient(var(--ink) 0deg 1deg, transparent 1deg 6deg);
    -webkit-mask-image: radial-gradient(circle, transparent 0 7.05em, #000 7.15em 7.5em, transparent 7.6em 100%);
            mask-image: radial-gradient(circle, transparent 0 7.05em, #000 7.15em 7.5em, transparent 7.6em 100%);
    opacity:.55;
  }
  /* hour ticks */
  .case::after{
    z-index:2;
    background: repeating-conic-gradient(var(--ink) 0deg 2.2deg, transparent 2.2deg 30deg);
    -webkit-mask-image: radial-gradient(circle, transparent 0 6.95em, #000 7.0em 7.7em, transparent 7.8em 100%);
            mask-image: radial-gradient(circle, transparent 0 6.95em, #000 7.0em 7.7em, transparent 7.8em 100%);
    opacity:.8;
  }

  .dial-face{
    position:absolute; z-index:3; border-radius:50%;
    top:50%; left:50%; width:13.8em; height:13.8em; transform:translate(-50%,-50%);
    background: radial-gradient(circle at 50% 42%, var(--paper-raised), var(--paper-deep) 88%);
    box-shadow: inset 0 .05em .6em var(--shadow), inset 0 0 0 .07em var(--line);
  }

  .numerals{ position:absolute; inset:0; z-index:4; }
  .numerals span{
    position:absolute; top:50%; left:50%; width:0; height:0;
  }
  .numerals span i{
    position:absolute; top:0; left:0; display:block;
    font-style:normal; font-family:'Cinzel',serif; font-weight:600;
    font-size:.68em; letter-spacing:.02em; color:var(--ink-soft);
  }

  .dial-content{
    position:absolute; z-index:5; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:.5em;
  }
  .status{
    font-size:.6em; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-soft);
  }
  .status.is-running{ color:var(--aetherite-bright); }
  .status.is-hidden{ color:var(--rust); }

  .window{
    width:7em; height:2.5em; border-radius:.2em; background:var(--lcd-bg);
    box-shadow: inset 0 .1em .3em rgba(0,0,0,.7), 0 .05em 0 rgba(255,255,255,.08);
    display:flex; align-items:center; justify-content:center;
  }
  .display{
    font-size:1em; font-weight:600; letter-spacing:.03em;
    font-variant-numeric:tabular-nums; color:var(--lcd-fg); line-height:1;
  }
  .display.masked{ color:var(--lcd-fg-masked); animation:pulse 1.8s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce){ .display.masked{ animation:none; opacity:.7; } }
  @keyframes pulse{ 0%,100%{ opacity:.4; } 50%{ opacity:1; } }

  .maker{ font-size:.48em; letter-spacing:.14em; color:var(--ink-soft); opacity:.7; }

  /* crown + pushers */
  .crown{
    position:absolute; z-index:6; top:-.85em; left:50%; transform:translateX(-50%);
    width:1.5em; height:1.05em; border-radius:.18em;
    background: repeating-linear-gradient(90deg, var(--brass-1) 0 .09em, var(--brass-3) .09em .18em);
    box-shadow: 0 .1em .2em var(--shadow), inset 0 .05em 0 rgba(255,255,255,.3);
  }

  .pusher{
    position:absolute; z-index:6; top:-.7em; width:1.35em; height:.95em; border-radius:.16em;
    background: linear-gradient(180deg, var(--brass-1), var(--brass-2));
    box-shadow: 0 .12em .2em var(--shadow), inset 0 .05em 0 rgba(255,255,255,.35);
    border:none; cursor:pointer; padding:0;
    display:flex; align-items:center; justify-content:center;
  }
  .pusher:hover{ filter:brightness(1.06); }
  .pusher:active, .pusher.is-active{
    transform:translateY(.06em);
    background: linear-gradient(180deg, var(--brass-2), var(--brass-3));
  }
  .pusher:focus-visible{ outline:2px solid var(--focus); outline-offset:2px; }
  .pusher:disabled{ opacity:.45; cursor:not-allowed; filter:none; }
  .pusher-left{ left:calc(50% - 3.05em); }
  .pusher-right{ left:calc(50% + 1.7em); }

  .jewel{
    width:.42em; height:.42em; border-radius:50%; background:var(--brass-3);
    box-shadow: inset 0 0 .05em rgba(0,0,0,.6);
    transition: background .15s ease;
  }
  .pusher-right.blind-on .jewel{ background:var(--rust); box-shadow:0 0 .35em var(--rust); }

  .mode-row{
    display:flex; align-items:center; gap:.5em; font-size:.85em;
    background:none; border:none; padding:.2em .4em; margin:0 auto; cursor:pointer;
    font-family:'IBM Plex Mono',monospace; color:var(--ink-soft); border-radius:3px;
  }
  .mode-row:hover{ background:var(--paper-deep); }
  .mode-row:focus-visible{ outline:2px solid var(--focus); outline-offset:2px; }
  .mode-row:disabled{ opacity:.5; cursor:not-allowed; }
  .mode-row .dot{
    width:.6em; height:.6em; border-radius:50%; background:var(--ink-soft);
    box-shadow: inset 0 0 .08em rgba(0,0,0,.5);
  }
  .mode-row.on .dot{ background:var(--rust); box-shadow:0 0 .4em var(--rust); }
  .mode-row .state{ font-weight:600; color:var(--ink-soft); }
  .mode-row.on .state{ color:var(--rust); }

  /* ============ controls ============ */
  .controls{ display:flex; align-items:stretch; gap:.7em; }

  .bigbtn{
    font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:1.15em; letter-spacing:.12em;
    text-transform:uppercase; padding:.6em 2.2em; border-radius:.5em; border:none; cursor:pointer;
    min-height:2.4em;
    background:linear-gradient(180deg, var(--brass-1), var(--brass-2)); color:var(--paper-deep);
    box-shadow:0 .2em .35em var(--shadow), inset 0 .08em 0 rgba(255,255,255,.35);
  }
  .bigbtn:hover{ filter:brightness(1.05); }
  .bigbtn:active, .bigbtn.is-active{
    transform:translateY(.04em);
    background:linear-gradient(180deg, var(--rust), var(--brass-3)); color:var(--paper);
  }
  .bigbtn:focus-visible{ outline:2px solid var(--focus); outline-offset:2px; }
  .bigbtn:disabled{
    opacity:.35; cursor:not-allowed; filter:none; transform:none;
    box-shadow:0 .2em .35em var(--shadow), inset 0 .08em 0 rgba(255,255,255,.35);
  }

  .resetbtn{
    font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:1.15em; letter-spacing:.12em;
    text-transform:uppercase; padding:.6em 1.3em; border-radius:.5em; cursor:pointer;
    min-height:2.4em;
    background:transparent; color:var(--ink-soft); border:1px solid var(--line);
  }
  .resetbtn:not(:disabled):hover{ background:var(--paper-deep); color:var(--ink); }
  .resetbtn:not(:disabled):active{ transform:translateY(.04em); }
  .resetbtn:focus-visible{ outline:2px solid var(--focus); outline-offset:2px; }
  .resetbtn:disabled{ opacity:.3; cursor:not-allowed; }

  /* ============ plate ============ */
  .plate{ text-align:center; display:flex; flex-direction:column; gap:.35em; }
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="watch" id="watch">
    <div class="case">
      <div class="dial-face"></div>
      <div class="numerals" id="numerals"></div>
      <div class="dial-content">
        <div class="status" id="status">READY</div>
        <div class="window"><div class="display" id="display">00:00.00</div></div>
        <div class="maker">Timer</div>
      </div>
      <div class="crown"></div>
      <button class="pusher pusher-left" id="mainBtn" type="button" aria-label="Start or stop the stopwatch"></button>
      <button class="pusher pusher-right" id="blindBtn" type="button" aria-label="Toggle blind stop mode"><span class="jewel" id="jewel"></span></button>
    </div>
  </div>

  <div class="controls">
    <button type="button" class="bigbtn" id="bigBtn">Start</button>
    <button type="button" class="resetbtn" id="resetBtn">Reset</button>
  </div>

  <div class="plate">
    <button type="button" class="mode-row" id="modeRow" aria-label="Toggle blind stop mode">
      <span class="dot" id="modeDot"></span>
      <span>Blind?:</span>
      <span class="state" id="modeState">Off</span>
    </button>
  </div>
</div>

<script>
  (function(){
    var ROMAN = ['XII','I','II','III','IV','V','VI','VII','VIII','IX','X','XI'];
    var numerals = document.getElementById('numerals');
    var html = '';
    for(var i=0;i<12;i++){
      var deg = i*30;
      html += '<span style="transform:rotate('+deg+'deg) translateY(-6.6em)"><i style="transform:translate(-50%,-50%) rotate('+(-deg)+'deg)">'+ROMAN[i]+'</i></span>';
    }
    numerals.innerHTML = html;

    var stage = document.getElementById('stage');
    var display = document.getElementById('display');
    var status = document.getElementById('status');
    var mainBtn = document.getElementById('mainBtn');
    var bigBtn = document.getElementById('bigBtn');
    var resetBtn = document.getElementById('resetBtn');
    var blindBtn = document.getElementById('blindBtn');
    var modeRow = document.getElementById('modeRow');
    var modeState = document.getElementById('modeState');

    // 'ready' -> 'running' -> 'stopped' -> (reset) -> 'ready'
    var mode = 'ready';
    var blind = false;
    var startTs = null;
    var rafId = null;
    var MASK = '\u2022\u2022:\u2022\u2022.\u2022\u2022';
    var ZERO = '00:00.00';

    function renderBlind(){
      blindBtn.classList.toggle('blind-on', blind);
      modeRow.classList.toggle('on', blind);
      modeState.textContent = blind ? 'On' : 'Off';
    }

    function renderMode(){
      var running = (mode === 'running');
      var stopped = (mode === 'stopped');

      stage.classList.toggle('running', running);

      bigBtn.textContent = running ? 'Stop' : 'Start';
      bigBtn.disabled = stopped;            // reading stays until Reset clears it
      bigBtn.classList.toggle('is-active', running);

      mainBtn.disabled = stopped;
      mainBtn.classList.toggle('is-active', running);

      resetBtn.disabled = !stopped;

      blindBtn.disabled = running;
      modeRow.disabled = running;
    }

    try{
      if(localStorage.getItem('blindStopwatch.blind') === '1'){ blind = true; }
    }catch(e){}
    renderBlind();
    renderMode();

    function fmt(ms){
      var totalCenti = Math.floor(ms/10);
      var centi = totalCenti % 100;
      var totalSec = Math.floor(totalCenti/100);
      var sec = totalSec % 60;
      var min = Math.floor(totalSec/60);
      function pad(n){ return (n<10?'0':'')+n; }
      return pad(min)+':'+pad(sec)+'.'+pad(centi);
    }

    function tick(){
      if(mode !== 'running') return;
      if(!blind) display.textContent = fmt(performance.now()-startTs);
      rafId = requestAnimationFrame(tick);
    }

    function start(){
      if(mode !== 'ready') return;
      mode = 'running';
      startTs = performance.now();
      status.textContent = blind ? 'RUNNING' : 'RUNNING';
      status.className = 'status ' + (blind ? 'is-hidden' : 'is-running');
      display.textContent = blind ? MASK : ZERO;
      display.classList.toggle('masked', blind);
      renderMode();
      rafId = requestAnimationFrame(tick);
    }

    function stop(){
      if(mode !== 'running') return;
      var elapsed = performance.now() - startTs;
      mode = 'stopped';
      if(rafId){ cancelAnimationFrame(rafId); rafId = null; }
      display.classList.remove('masked');
      display.textContent = fmt(elapsed);
      status.textContent = 'STOPPED';
      status.className = 'status';
      renderMode();
    }

    function reset(){
      if(mode !== 'stopped') return;
      mode = 'ready';
      display.classList.remove('masked');
      display.textContent = ZERO;
      status.textContent = 'READY';
      status.className = 'status';
      renderMode();
    }

    function toggleRun(){
      if(mode === 'running'){ stop(); }
      else if(mode === 'ready'){ start(); }
    }

    mainBtn.addEventListener('click', toggleRun);
    bigBtn.addEventListener('click', toggleRun);
    resetBtn.addEventListener('click', reset);

    function toggleBlind(){
      if(mode === 'running') return;
      blind = !blind;
      renderBlind();
      try{ localStorage.setItem('blindStopwatch.blind', blind ? '1' : '0'); }catch(e){}
    }
    blindBtn.addEventListener('click', toggleBlind);
    modeRow.addEventListener('click', toggleBlind);

    document.addEventListener('keydown', function(e){
      // let a focused button handle its own Space/Enter natively
      var t = e.target;
      if(t && (t.tagName === 'BUTTON' || t.isContentEditable)) return;

      if(e.code === 'Space'){ e.preventDefault(); toggleRun(); }
      else if(e.code === 'KeyR'){ e.preventDefault(); reset(); }
    });
  })();
</script>
</body>
</html>
